apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pi-llm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kdvops/LLM.git
    targetRevision: main
    path: kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: local-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
