apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-llm-config
  namespace: local-ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  MODEL_PATH: /models/qwen2.5-coder-3b-instruct-q4_k_m.gguf
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf
  CTX_SIZE: "4096"
  THREADS: "4"
  THREADS_BATCH: "4"
  BATCH_SIZE: "256"
  UBATCH_SIZE: "128"
  PARALLEL: "1"
  CACHE_TYPE_K: "q8_0"
  CACHE_TYPE_V: "q8_0"
