apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-llm
  namespace: local-ai
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pi-llm
  template:
    metadata:
      labels:
        app: pi-llm
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: model-download
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              FILE="${MODEL_PATH:-/models/Qwen3.5-2B-UD-Q4_K_XL.gguf}"
              URL="${MODEL_URL:-https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-UD-Q4_K_XL.gguf}"
              if [ -s "$FILE" ]; then
                echo "Model already exists: $FILE"
                exit 0
              fi
              tmp="${FILE}.part"
              mkdir -p "$(dirname "$tmp")"
              touch "$tmp"
              curl -L --fail --retry 20 --retry-delay 10 --retry-all-errors \
                --connect-timeout 30 \
                --speed-limit 1024 --speed-time 120 \
                -C - \
                -o "$tmp" "$URL"
              mv "$tmp" "$FILE"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
          envFrom:
            - configMapRef:
                name: pi-llm-config
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pi-llm-config
          env:
            - name: LLAMA_ARG_MODEL
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: MODEL_PATH
            - name: LLAMA_ARG_CTX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: CTX_SIZE
            - name: LLAMA_ARG_THREADS
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: THREADS
            - name: LLAMA_ARG_THREADS_BATCH
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: THREADS_BATCH
            - name: LLAMA_ARG_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: BATCH_SIZE
            - name: LLAMA_ARG_UBATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: UBATCH_SIZE
            - name: LLAMA_ARG_PARALLEL
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: PARALLEL
            - name: LLAMA_ARG_CACHE_TYPE_K
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: CACHE_TYPE_K
            - name: LLAMA_ARG_CACHE_TYPE_V
              valueFrom:
                configMapKeyRef:
                  name: pi-llm-config
                  key: CACHE_TYPE_V
            - name: LLAMA_ARG_HOST
              value: 0.0.0.0
            - name: LLAMA_ARG_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 1800Mi
            limits:
              cpu: "4"
              memory: 3500Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: pi-llm-models
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
