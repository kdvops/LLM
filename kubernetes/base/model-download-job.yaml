apiVersion: batch/v1
kind: Job
metadata:
  name: pi-llm-model-download
  namespace: local-ai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              FILE="${MODEL_PATH:-/models/qwen2.5-coder-3b-instruct-q4_k_m.gguf}"
              URL="${MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf}"
              if [ -s "$FILE" ]; then
                echo "Model already exists: $FILE"
                exit 0
              fi
              tmp="${FILE}.part"
              mkdir -p "$(dirname "$tmp")"
              touch "$tmp"
              curl -L --fail --retry 20 --retry-delay 10 --retry-all-errors \
                --connect-timeout 30 \
                --speed-limit 1024 --speed-time 120 \
                -C - \
                -o "$tmp" "$URL"
              mv "$tmp" "$FILE"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: pi-llm-config
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: pi-llm-models
