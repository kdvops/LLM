apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: pi-llm
  namespace: local-ai
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  hosts:
    - llm.kdvops.com
  gateways:
    - istio-system/kdvops-gateway
#    - pi-llm
  http:
    - route:
        - destination:
            host: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
            port:
              number: 8080
      timeout: 300s
